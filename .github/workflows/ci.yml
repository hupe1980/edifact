name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (all targets, all features, warnings denied)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  concepts-check:
    runs-on: ubuntu-latest
    name: concepts-check
    steps:
      - uses: actions/checkout@v4
      # Published files must not cite the gitignored planning paths.
      - run: bash scripts/test-concepts-check.sh
      - run: bash scripts/concepts-check.sh

  deny:
    runs-on: ubuntu-latest
    name: deny
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `--all-features` is the action default, but stated explicitly: it
          # decides whether the optional `miette` subtree is in the graph, and
          # a local run without it audits a different dependency set.
          arguments: --all-features
          command: check advisories bans licenses sources

  msrv-check:
    runs-on: ubuntu-latest
    name: msrv-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      # The derive UI suite runs here and on the stable feature-matrix job.
      # Its blessed .stderr files hold only the derive's own diagnostics — the
      # one rustc-rendered warning they used to capture is now silenced at the
      # source — so the expectations no longer drift between toolchains.
      - name: Verify workspace builds and tests on MSRV
        env:
          EDIFACT_UI_TESTS: "1"
        run: cargo test --workspace --all-features --locked --no-fail-fast

  docsrs-check:
    runs-on: ubuntu-latest
    name: docsrs-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs.rs-style docs with warnings denied
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc -p edifact --all-features --no-deps --locked

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check-workspace
            command: cargo check --workspace --locked
          - name: test-workspace
            command: cargo test --workspace --locked
          - name: test-no-default-features
            command: cargo test -p edifact --no-default-features --locked
          - name: test-all-features
            command: cargo test -p edifact --all-features --locked
          # The codec alone: tests in debug and release (range edges), and
          # `dtm` must add no crate to the dependency tree.
          - name: test-dtm
            command: >-
              cargo test -p edifact --no-default-features --features dtm --locked &&
              cargo test -p edifact --release --no-default-features --features dtm --locked --test dtm_compare &&
              diff <(cargo tree -p edifact -e normal --no-default-features --prefix none --locked)
              <(cargo tree -p edifact -e normal --no-default-features --features dtm --prefix none --locked)
          - name: test-dtm-time
            command: cargo test -p edifact --no-default-features --features dtm-time --locked
          # The UI expectations are toolchain-portable, so run them on stable
          # too: pinning them to MSRV alone meant a regression in the derive's
          # diagnostics went unseen until that one job ran.
          - name: test-derive-ui
            command: EDIFACT_UI_TESTS=1 cargo test -p edifact-derive --locked
          - name: test-all-features-examples
            command: cargo test -p edifact --all-features --examples --locked
          # `cargo test` does not build `harness = false` bench targets, so a
          # broken benchmark would otherwise only surface on the bench jobs.
          - name: build-benches
            command: cargo test -p edifact --benches --no-run --locked
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  fuzz-smoke:
    runs-on: ubuntu-latest
    name: fuzz-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test` runs the bolero targets in bounded random-exploration mode.
      # This job additionally runs them in release for a longer, faster sweep.
      - name: Run property/fuzz targets
        env:
          BOLERO_RANDOM_ITERATIONS: "50000"
        run: cargo test -p edifact --release --features dtm --test bolero_harness --locked
      # The slice and reader paths must return the same `Result` for every
      # input; random mode needs depth to reach malformed structure.
      - name: Parse-path parity (1M iterations)
        env:
          BOLERO_RANDOM_ITERATIONS: "1000000"
        run: cargo test -p edifact --release --test bolero_harness --locked fuzz_parity
      - name: Parse-path parity, exhaustive sweep (length <= 5)
        run: cargo test -p edifact --release --test parse_path_parity --locked exhaustive
      - name: Resource bounds at the default limits
        run: cargo test -p edifact --release --test resource_limits --test allocation_budget --locked

  benchmark-smoke:
    runs-on: ubuntu-latest
    name: benchmark-smoke
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion benchmark smoke suite
        run: cargo bench -p edifact --bench bench_criterion -- --noplot --sample-size 10
      - name: Download latest main benchmark baseline artifact
        id: download-baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci.yml
          workflow_conclusion: success
          branch: main
          name: criterion-baseline-main
          path: target/
          if_no_artifact_found: warn
      - name: Install critcmp
        if: steps.download-baseline.outcome == 'success'
        run: cargo install critcmp --locked
      - name: Save PR benchmark baseline
        if: steps.download-baseline.outcome == 'success'
        run: cargo bench -p edifact --bench bench_criterion -- --noplot --sample-size 20 --save-baseline pr
      - name: Compare PR performance against main baseline
        if: steps.download-baseline.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Report only: critcmp `--threshold` filters output and exits 0 on a
          # regression; it fails on errors such as no matching benchmarks
          # (a baseline from before a rename), which is skipped below.
          if output=$(critcmp main pr --threshold 5 2>&1); then
            echo "$output" | tee bench-compare.log
          elif echo "$output" | grep -qi "no benchmark comparisons"; then
            echo "No comparable benchmarks found; the main baseline may be from a different benchmark set. Skipping regression gate."
          else
            echo "$output" | tee bench-compare.log
            exit 1
          fi
      - name: Baseline unavailable notice
        if: steps.download-baseline.outcome != 'success'
        run: echo "No main baseline artifact available yet; skipped PR baseline comparison."

  benchmark-full-baseline:
    runs-on: ubuntu-latest
    name: benchmark-full-baseline
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run full criterion suite and save main baseline
        run: cargo bench -p edifact --bench bench_criterion -- --noplot --sample-size 50 --warm-up-time 2 --measurement-time 8 --save-baseline main
      - name: Upload criterion baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline-main
          path: target/criterion
          if-no-files-found: error

  release-check:
    runs-on: ubuntu-latest
    name: release-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Stale tarballs from the cache must not satisfy the contents check.
      - name: Verify both crates package cleanly
        run: |
          rm -f target/package/*.crate target/package/tmp-crate/*.crate
          cargo publish --dry-run --workspace --locked
      - name: Check package contents
        run: bash scripts/package-contents-check.sh
      - name: Verify crate versions match across workspace
        shell: bash
        run: |
          set -euo pipefail
          derive_ver=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='edifact-derive'))")
          main_ver=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='edifact'))")
          echo "edifact-derive=${derive_ver}  edifact=${main_ver}"
          if [[ "${derive_ver}" != "${main_ver}" ]]; then
            echo "Version mismatch between crates: derive=${derive_ver} main=${main_ver}"
            exit 1
          fi

  semver:
    runs-on: ubuntu-latest
    name: semver
    # Reads the repository and writes the job summary; a third-party installer
    # runs here, so the token gets no write scope.
    permissions:
      contents: read
    env:
      DERIVE_NOTE: >-
        edifact-derive is a proc-macro crate and is not semver-analysed; its
        contract is covered by the derive UI suite (EDIFACT_UI_TESTS=1).
      BUMP_HINT: >-
        Breaking change at a non-breaking version: bump workspace.package.version
        to the next minor (and the edifact-derive requirement in
        crates/edifact/Cargo.toml) and add a Migration note under [Unreleased].
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
      # Baseline: the newest non-yanked `edifact` on crates.io.  The release
      # type comes from the workspace version, so a break passes only at the
      # next minor.
      # Exit 100 is a semver violation; anything else means the check did not run.
      - name: semver (all features)
        run: cargo semver-checks -p edifact --all-features || { s=$?; [[ $s -eq 100 ]] && echo "::error::${BUMP_HINT}" || echo "::error::semver check could not run (crates.io baseline unreachable or build failed)"; exit $s; }
      - name: semver (default features)
        run: cargo semver-checks -p edifact --default-features || { s=$?; [[ $s -eq 100 ]] && echo "::error::${BUMP_HINT}" || echo "::error::semver check could not run (crates.io baseline unreachable or build failed)"; exit $s; }
      - name: Derive note
        if: always()
        run: echo "${DERIVE_NOTE}"
      - name: Break report (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## Semver report (advisory)"
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo semver-checks -p edifact --all-features --release-type minor --color never 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
