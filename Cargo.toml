[workspace]
# MSRV-aware resolution; a virtual workspace does not inherit the edition default.
resolver = "3"
members = [
    "crates/edifact",
    "crates/edifact-derive",
]

[workspace.package]
version = "0.20.0"
edition = "2024"
rust-version = "1.88"
authors = ["hupe1980"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bolero = { version = "0.13", features = ["arbitrary"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
divan = "0.1"
memchr = "2"
miette = { version = "7", features = ["fancy"] }
proc-macro2 = "1"
quote = "1"
# `rc` is required: `ValidationIssue::segment_group` is an `Option<Arc<str>>`,
# and serde does not serialize `Rc`/`Arc` without it.
serde = { version = "1", features = ["derive", "rc"] }
# dev-only: serde round-trip tests.
serde_json = "1"
# `union` drops the per-SmallVec bool tag, shrinking `Element::components`.
smallvec = { version = "1", features = ["union"] }
# 3 to match what `thiserror` already pulls in, so syn is compiled once.
# No `full`: the derive only inspects a `DeriveInput`, never whole items.
syn = "3"
thiserror = "2"
# Optional (`dtm-time`). 0.3.47 fixes RUSTSEC-2026-0009.
time = { version = "0.3.47", default-features = false }
# dev-only. `fs` and `io-util` back the async-integration guide's snippets,
# which are compiled as doctests.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "io-util",
] }
trybuild = "1"
expect-test = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true