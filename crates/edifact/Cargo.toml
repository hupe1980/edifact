[package]
name        = "edifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "EDIFACT (ISO 9735) for Rust: zero-copy parser, envelope-computing writer, typed derive, layered validation, DTM dates and CONTRL"
readme = "../../README.md"
repository = "https://github.com/hupe1980/edifact"
homepage = "https://hupe1980.github.io/edifact/"
documentation = "https://docs.rs/edifact"
keywords = ["edifact", "edi", "iso9735", "parser", "unedifact"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["derive"]
derive = ["dep:edifact-derive"]
diagnostics = ["dep:miette"]
serde = ["dep:serde"]
# UNCL 2379 date/time codec (`edifact::dtm`); no dependencies.
dtm = []
# `dtm` plus conversions to and from `time` 0.3.
dtm-time = ["dtm", "dep:time"]

[dependencies]
memchr    = { workspace = true }
smallvec  = { workspace = true }
thiserror = { workspace = true }
miette    = { workspace = true, optional = true }
serde     = { workspace = true, optional = true }
time      = { workspace = true, optional = true }
edifact-derive = { version = "0.20.0", path = "../edifact-derive", optional = true }

[dev-dependencies]
criterion = { workspace = true }
divan  = { workspace = true }
bolero = { workspace = true }
tokio  = { workspace = true }
expect-test = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name    = "bench_core"
harness = false

[[bench]]
name    = "bench_criterion"
harness = false

[[example]]
name = "cookbook_parse_map_validate_write"

[[example]]
name = "cookbook_typed_derive"
required-features = ["derive"]

[[example]]
name = "cookbook_typed_streaming"
required-features = ["derive"]

[[example]]
name = "cookbook_contrl_acknowledgement"

[[example]]
name = "cookbook_diagnostics"

[[example]]
name = "cookbook_fixture_validation"

[[example]]
name = "cookbook_profile_error_mapping"

[[example]]
name = "cookbook_profile_packs"

[[example]]
name = "cookbook_message_window_streaming"
required-features = ["derive"]

[[example]]
name = "cookbook_async_tokio_integration"

[[example]]
name = "cookbook_streamed_progressive_validation"

[[test]]
name = "dtm_codec"
required-features = ["dtm"]

[[test]]
name = "dtm_compare"
required-features = ["dtm"]

[[test]]
name = "dtm_validator"
required-features = ["dtm"]

[[test]]
name = "dtm_mako_parity"
required-features = ["dtm-time"]

[[test]]
name = "bolero_harness"
path = "tests/bolero_harness.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
