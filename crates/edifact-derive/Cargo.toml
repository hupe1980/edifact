[package]
name        = "edifact-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Derive macros for the edifact crate: typed EDIFACT segments, composites and messages"
readme = "../../README.md"
repository = "https://github.com/hupe1980/edifact"
homepage = "https://hupe1980.github.io/edifact/"
documentation = "https://docs.rs/edifact-derive"
keywords = ["edifact", "edi", "derive", "proc-macro", "unedifact"]
categories = ["encoding", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
